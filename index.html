<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMine</title>
    
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts: Inter (400, 700) & DM Serif Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

<body>

    <!-- Navigation Bar -->
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <!-- Logo: Image only, no link behavior -->
            <img src="assets/logo.svg" alt="WebMine Logo" class="nav-logo">
            
            <div class="nav-right">
                <nav class="nav-links">
                    <a href="index.html" class="nav-link current-page">Home</a>
                    <a href="services.html" class="nav-link">Services</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </nav>
                
                <!-- Pill Button -->
                <a href="contact.html" class="btn-pill">Get in touch</a>
            </div>
        </div>

    <!-- Main Content: Hero Section -->
    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-headline">Websites for any need, built for you.</h1>
            <p class="hero-subheadline">WebMine digs into what you need and develops a site that delivers it.</p>
            <!-- Regular Button -->
            <a href="services.html" class="btn-regular">See our services →</a>
        </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <img src="assets/logo.svg" alt="WebMine Logo" class="footer-logo">
            <p class="footer-copyright">© 2026 WebMine</p>
        </div>
    </footer>

    <script src="js/nav.js" defer></script>
