<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBMINE - Page 2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Top heading ── */
    .site-title {
      margin-top: 40px;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 6px;
      text-align: center;
      color: #000;
    }

    /* ── Main content area ── */
    .main {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
      width: 100%;
      padding: 0 60px;
    }

    /* ── Half wheel wrapper ── */
    .wheel-wrapper {
      position: relative;
      width: 160px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* ── Semicircle ── */
    .half-circle {
      width: 130px;
      height: 160px;
      background-color: #000;
      border-radius: 0 160px 160px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .half-circle .w-logo {
      font-size: 58px;
      font-weight: bold;
      color: #fff;
      font-family: Arial, sans-serif;
      margin-left: 12px;
    }

    /* ── Arrow buttons ── */
    .arrow-btn {
      position: absolute;
      left: 10px;
      background: #000;
      border: none;
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background 0.2s;
    }

    .arrow-btn:hover {
      background: #333;
    }

    .arrow-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .arrow-up {
      top: 10px;
    }

    .arrow-down {
      bottom: 10px;
    }

    /* ── Connector line ── */
    .connector {
      width: 70px;
      height: 2px;
      background-color: #000;
      flex-shrink: 0;
    }

    /* ── Page title box ── */
    .page-title-box {
      border: 2.5px solid #000;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      color: #000;
      background: #fff;
      white-space: nowrap;
    }

    /* ── Description ── */
    .description {
      margin-top: 60px;
      font-size: 16px;
      color: #333;
      text-align: center;
      max-width: 480px;
    }
  </style>
</head>
<body>

  <h1 class="site-title">WEBMINE</h1>

  <div class="main">
    <div class="wheel-wrapper">

      <!-- UP arrow → Page 1 -->
      <button class="arrow-btn arrow-up" onclick="window.location.href='../Page1/page1.html'" title="Go to Page 1">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 19V5M5 11l7-7 7 7"/>
        </svg>
      </button>

      <!-- DOWN arrow → Page 3 -->
      <button class="arrow-btn arrow-down" onclick="window.location.href='../Page3/page3.html'" title="Go to Page 3">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5v14M5 13l7 7 7-7"/>
        </svg>
      </button>

      <!-- Semicircle -->
      <div class="half-circle">
        <span class="w-logo">W</span>
      </div>
    </div>

    <!-- Connector line -->
    <div class="connector"></div>

    <!-- Page title box -->
    <div class="page-title-box">Page 2</div>
  </div>

  <!-- Description below the wheel section -->
  <p class="description">This will be the description of Page 2</p>

</body>
</html>
